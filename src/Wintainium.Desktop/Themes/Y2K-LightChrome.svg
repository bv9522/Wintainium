<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#DDE5E9"/>
    <stop offset=".18" stop-color="#8A999F"/>
    <stop offset=".34" stop-color="#C7D1D5"/>
    <stop offset=".52" stop-color="#66767E"/>
    <stop offset=".70" stop-color="#BFC9CD"/>
    <stop offset=".86" stop-color="#7A8990"/>
    <stop offset="1" stop-color="#D4DDE1"/>
  </linearGradient>
  <radialGradient id="sphere" cx=".32" cy=".24" r=".78">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".16" stop-color="#EAF1F4"/>
    <stop offset=".38" stop-color="#93A4AC"/>
    <stop offset=".57" stop-color="#4E606A"/>
    <stop offset=".72" stop-color="#C8D3D8"/>
    <stop offset=".86" stop-color="#6F8089"/>
    <stop offset="1" stop-color="#DCE5E9"/>
  </radialGradient>
  <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FAFB"/>
    <stop offset=".12" stop-color="#AAB8BE"/>
    <stop offset=".30" stop-color="#4B5D66"/>
    <stop offset=".45" stop-color="#D9E2E6"/>
    <stop offset=".62" stop-color="#74858E"/>
    <stop offset=".78" stop-color="#EEF3F5"/>
    <stop offset="1" stop-color="#667780"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#72D2FF" stop-opacity=".75"/>
    <stop offset=".5" stop-color="#008FD5" stop-opacity=".30"/>
    <stop offset="1" stop-color="#0066A3" stop-opacity=".05"/>
  </linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#base)"/>
<ellipse cx="1360" cy="115" rx="250" ry="74" fill="#FFFFFF" opacity=".18"/>
<ellipse cx="410" cy="790" rx="330" ry="70" fill="#FFFFFF" opacity=".12"/>

<path d="M-120 165 C130 20 300 35 390 170 S650 320 810 155" fill="none" stroke="#3F5059" stroke-opacity=".22" stroke-width="82"/>
<path d="M-120 150 C130 5 300 20 390 155 S650 305 810 140" fill="none" stroke="url(#pipe)" stroke-width="58"/>
<path d="M-120 136 C130 -8 300 6 390 142 S650 292 810 127" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="10"/>

<path d="M1010 925 C1050 760 1140 690 1295 710 S1510 620 1650 455" fill="none" stroke="#43545D" stroke-opacity=".25" stroke-width="96"/>
<path d="M1010 915 C1050 750 1140 680 1295 700 S1510 610 1650 445" fill="none" stroke="url(#pipe)" stroke-width="70"/>
<path d="M1018 894 C1060 744 1144 700 1292 717 S1508 625 1630 470" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="11"/>

<circle cx="1370" cy="185" r="128" fill="#4B5C65" opacity=".22"/>
<circle cx="1350" cy="165" r="118" fill="url(#sphere)"/>
<ellipse cx="1310" cy="123" rx="43" ry="24" fill="#FFFFFF" opacity=".55"/>
<ellipse cx="1390" cy="210" rx="76" ry="32" fill="#33464F" opacity=".16"/>

<circle cx="250" cy="665" r="104" fill="#4B5C65" opacity=".20"/>
<circle cx="230" cy="645" r="94" fill="url(#sphere)"/>
<ellipse cx="198" cy="614" rx="34" ry="19" fill="#FFFFFF" opacity=".50"/>

<circle cx="905" cy="410" r="54" fill="url(#sphere)" opacity=".72"/>
<ellipse cx="888" cy="393" rx="18" ry="10" fill="#FFFFFF" opacity=".48"/>

<path d="M680 0 C620 120 690 190 790 210 S930 260 900 380" fill="none" stroke="url(#blue)" stroke-width="16"/>
<path d="M680 0 C620 120 690 190 790 210 S930 260 900 380" fill="none" stroke="#8BDFFF" stroke-opacity=".28" stroke-width="3"/>


<!-- Wintainium identity mark: engineered chrome W with an integrated downward acquisition/update arrow. -->
<defs>
  <linearGradient id="wChrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".12" stop-color="#C9D5DA"/>
    <stop offset=".30" stop-color="#52646D"/>
    <stop offset=".46" stop-color="#EAF1F4"/>
    <stop offset=".62" stop-color="#71828B"/>
    <stop offset=".80" stop-color="#DCE5E9"/>
    <stop offset="1" stop-color="#53656E"/>
  </linearGradient>
  <linearGradient id="wBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9BE4FF" stop-opacity=".95"/>
    <stop offset=".5" stop-color="#008FD5" stop-opacity=".80"/>
    <stop offset="1" stop-color="#0066A3" stop-opacity=".35"/>
  </linearGradient>
  <filter id="wShadow" x="-30%" y="-30%" width="160%" height="180%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <filter id="wGlow" x="-30%" y="-30%" width="160%" height="180%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>
<g aria-label="Wintainium W identity" transform="translate(0,15)" opacity=".92">
  <!-- Deep machined shadow gives the mark weight without turning the background into a logo poster. -->
  <path d="M520 245 L650 640 L800 395 L950 640 L1080 245 L1000 245 L920 505 L800 315 L680 505 L600 245 Z"
        fill="#26353D" opacity=".38" filter="url(#wShadow)" transform="translate(0,18)"/>

  <!-- Broad engineered W: the center junction drops into the arrow shaft rather than being a pasted icon. -->
  <path d="M520 245 L650 640 L800 395 L950 640 L1080 245 L1000 245 L920 505 L800 315 L680 505 L600 245 Z"
        fill="url(#wChrome)" stroke="#465963" stroke-width="5" stroke-linejoin="round"/>

  <!-- Machined center channel / acquisition arrow. -->
  <path d="M770 350 L800 395 L830 350 L830 455 L875 455 L800 535 L725 455 L770 455 Z"
        fill="#425761" opacity=".92"/>
  <path d="M774 355 L800 394 L826 355 L826 448 L864 448 L800 515 L736 448 L774 448 Z"
        fill="url(#wBlue)" opacity=".92"/>

  <!-- Controlled chrome reflections make the W belong to the liquid-metal environment. -->
  <path d="M556 264 L650 552" fill="none" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="9" stroke-linecap="round"/>
  <path d="M1044 264 L950 552" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="8" stroke-linecap="round"/>
  <path d="M696 540 L800 380 L904 540" fill="none" stroke="#FFFFFF" stroke-opacity=".30" stroke-width="7" stroke-linecap="round"/>
  <path d="M770 350 L800 395 L830 350 L830 455" fill="none" stroke="#A9ECFF" stroke-opacity=".72" stroke-width="3" filter="url(#wGlow)"/>
</g>
</svg>