<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03080E"/>
    <stop offset=".38" stop-color="#06131F"/>
    <stop offset=".72" stop-color="#050F1A"/>
    <stop offset="1" stop-color="#0B0820"/>
  </linearGradient>
  <radialGradient id="halo" cx=".52" cy=".40" r=".76">
    <stop offset="0" stop-color="#0B4160" stop-opacity=".42"/>
    <stop offset=".42" stop-color="#07304A" stop-opacity=".18"/>
    <stop offset=".72" stop-color="#06111D" stop-opacity=".06"/>
    <stop offset="1" stop-color="#02050A" stop-opacity=".42"/>
  </radialGradient>
  <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#25C4FF" stop-opacity=".23"/>
    <stop offset="1" stop-color="#08739F" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00B7FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00B7FF" stop-opacity=".48"/>
    <stop offset="1" stop-color="#00B7FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#57CFFF" opacity=".035"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#halo)"/>
<rect width="1600" height="900" fill="url(#scanlines)"/>

<!-- Fine technical grid -->
<g stroke="url(#grid)" fill="none">
  <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600" stroke-width="1" opacity=".34"/>
  <path d="M100 0 V900 M300 0 V900 M500 0 V900 M700 0 V900 M900 0 V900 M1100 0 V900 M1300 0 V900 M1500 0 V900" stroke-width="1" opacity=".30"/>
</g>

<!-- Secondary micro-grid -->
<g stroke="#1B6688" stroke-width=".5" opacity=".20">
  <path d="M0 75 H1600 M0 225 H1600 M0 375 H1600 M0 525 H1600 M0 675 H1600 M0 825 H1600"/>
  <path d="M0 0 V900 M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900 M1600 0 V900"/>
</g>

<!-- Restrained perspective traces -->
<g stroke="#00B7FF" fill="none">
  <path d="M0 840 L800 500 L1600 840" stroke-width="1" opacity=".20"/>
  <path d="M0 885 L800 525 L1600 885" stroke-width="1" opacity=".12"/>
  <path d="M260 900 L800 520 L1340 900" stroke-width="1" opacity=".11"/>
  <path d="M540 900 L800 520 L1060 900" stroke-width="1" opacity=".09"/>
  <path d="M800 520 V0" stroke-width="1" opacity=".10"/>
</g>

<!-- Quiet system-axis highlight -->
<rect x="150" y="108" width="1300" height="1" fill="url(#accent)" opacity=".38"/>
<rect x="150" y="792" width="1300" height="1" fill="url(#accent)" opacity=".20"/>

<!-- Sparse network nodes -->
<g fill="#39FF9A">
  <circle cx="800" cy="520" r="2.5" opacity=".55"/>
  <circle cx="500" cy="600" r="1.8" opacity=".34"/>
  <circle cx="1100" cy="600" r="1.8" opacity=".34"/>
  <circle cx="300" cy="750" r="1.5" opacity=".24"/>
  <circle cx="1300" cy="750" r="1.5" opacity=".24"/>
</g>
<g fill="#00B7FF">
  <circle cx="800" cy="520" r="8" opacity=".08" filter="url(#glow)"/>
  <circle cx="500" cy="600" r="6" opacity=".05" filter="url(#glow)"/>
  <circle cx="1100" cy="600" r="6" opacity=".05" filter="url(#glow)"/>
</g>
</svg>